name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar a suíte
        # A conftest já força a plataforma offscreen do Qt; a variável aqui é
        # apenas para deixar explícito que o runner não tem servidor gráfico.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
